# Publishes the static project site in site/ to the gh-pages branch, which GitHub Pages
# serves at botnick.github.io/deyecloud. Separate from the app: the dashboard itself
# deploys through Cloudflare Workers Builds.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: botnick
          user_email: botnick.xxx@gmail.com
          commit_message: "site: publish"
